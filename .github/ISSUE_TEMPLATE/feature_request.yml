name: Feature request
description: An idea for ADM, or something IDM does that ADM doesn't yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you're trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: If another download manager does this well, say which and how.
  - type: textarea
    id: more
    attributes:
      label: Anything else
