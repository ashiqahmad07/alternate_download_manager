<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ADM</title>
    <style>
      :root { --accent: #2563eb; --muted: #64748b; --line: #e2e8f0; }
      body { width: 360px; margin: 0; font: 13px "Segoe UI", system-ui, sans-serif; color: #0f172a; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
      header strong { font-size: 14px; }
      label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
      #list { max-height: 360px; overflow-y: auto; }
      .item { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
      .meta { flex: 1; min-width: 0; }
      .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub { color: var(--muted); font-size: 11px; }
      button { border: 0; border-radius: 4px; background: var(--accent); color: #fff; padding: 5px 10px; cursor: pointer; }
      button.link { background: none; color: var(--accent); padding: 0; }
      .empty { padding: 16px 14px; color: var(--muted); }
      footer { padding: 8px 14px; text-align: right; }
      #status { color: #b91c1c; padding: 0 14px 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>ADM</strong>
      <label><input type="checkbox" id="enabled" /> Capture downloads</label>
    </header>
    <div id="list"></div>
    <div id="status"></div>
    <footer><button class="link" id="open">Open ADM</button></footer>
    <script src="popup.js"></script>
  </body>
</html>
